name: Flutter Cloud Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Missing Folders
        run: |
          flutter create . --platforms=android
          sed -i '/<application/a \        android:hardwareAccelerated="true"\n        android:largeHeap="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml

      - name: Install Packages
        run: flutter pub get

      - name: Compile App APK
        run: flutter build apk --debug

      - name: Upload Finished App Installer
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Installer
          path: build/app/outputs/flutter-apk/app-debug.apk
          
