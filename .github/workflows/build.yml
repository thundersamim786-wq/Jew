name: Flutter Cloud Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restructure Project and Compile
        run: |
          # 1. Back up your existing Dart source files to a temporary folder
          mkdir backup_lib
          cp lib/*.dart backup_lib/

          # 2. Re-initialize a perfect, fully valid Flutter template structure
          rm -rf lib
          flutter create . --project-name=ultimate_vod --overwrite

          # 3. Restore your actual video sourcing code back into the new template
          rm -rf lib/*.dart
          cp backup_lib/*.dart lib/

          # 4. Inject required packages directly into the generated configuration file
          flutter pub add flutter_inappwebview
          flutter pub add http
          flutter pub add video_player

          # 5. Inject hardware performance tags for low-end devices into the manifest
          sed -i '/<application/a \        android:hardwareAccelerated="true"\n        android:largeHeap="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml

      - name: Install Packages
        run: flutter pub get

      - name: Compile App APK
        run: flutter build apk --debug

      - name: Upload Finished App Installer
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Installer
          path: build/app/outputs/flutter-apk/app-debug.apk
          
