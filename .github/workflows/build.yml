name: Flutter Cloud Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restructure Project and Compile
        run: |
          # 1. Back up all your source files to a safe temporary folder
          mkdir backup_lib
          cp lib/*.dart backup_lib/

          # 2. Re-initialize a perfectly clean Flutter app structure
          rm -rf lib
          flutter create . --project-name=ultimate_vod --overwrite

          # 3. Clear template defaults and restore your code files
          rm -f lib/*.dart
          cp backup_lib/*.dart lib/

          # 4. Check if main.dart exists. If not, find the primary file and fix its name
          if [ ! -f lib/main.dart ]; then
            PRIMARY_FILE=$(grep -l "void main()" lib/*.dart | head -n 1)
            if [ -n "$PRIMARY_FILE" ]; then
              mv "$PRIMARY_FILE" lib/main.dart
            fi
          fi

          # 5. Inject required streaming packages directly into the config file
          flutter pub add flutter_inappwebview
          flutter pub add http
          flutter pub add video_player

          # 6. Inject low-end hardware performance tags into the application manifest
          sed -i '/<application/a \        android:hardwareAccelerated="true"\n        android:largeHeap="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml

      - name: Install Packages
        run: flutter pub get

      - name: Compile App APK
        run: flutter build apk --debug

      - name: Upload Finished App Installer
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Installer
          path: build/app/outputs/flutter-apk/app-debug.apk
          
