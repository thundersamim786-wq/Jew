name: cinematic_vod
description: "A streaming and media playback mobile application built with Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & live TMDb API calls
  http: ^1.2.0

  # Native video playback engine
  video_player: ^2.8.2

  # In-app scraping & stream extraction engine
  flutter_inappwebview: ^6.0.0

  # Standard UI icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # App icon generator
  flutter_launcher_icons: ^0.13.1

# Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0E12"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Ensure icon asset directory is bundled
  assets:
    - assets/icon/
    
