name: cinematic_vod
description: "A streaming and media playback mobile application built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & JSON parsing
  http: ^1.2.0

  # Video playback engine
  video_player: ^2.8.2

  # Headless browser scraping engine
  flutter_inappwebview: ^6.0.0

  # Standard UI icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
