name: cinematic_vod
description: "A streaming and media playback mobile application built with Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & TMDb API
  http: ^1.2.0

  # Video playback
  video_player: ^2.8.2

  # In-app scraping & stream extraction
  flutter_inappwebview: ^6.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
